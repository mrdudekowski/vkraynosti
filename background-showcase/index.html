<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092a35">
  <title>Вкрайности — карта мыса Тобизина</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./site-style.css">
</head>
<body>
  <svg class="filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="handDrawnNoise">
      <feTurbulence result="noise" numOctaves="5" baseFrequency="0.0065" type="fractalNoise" />
      <feDisplacementMap yChannelSelector="G" xChannelSelector="R" scale="900" in2="noise" in="SourceGraphic" />
    </filter>
  </svg>

  <main class="map-showcase">
    <section class="map-picker section-shell" aria-labelledby="picker-title">
      <div class="map-section-heading">
        <p class="eyebrow"><span class="eyebrow-line"></span> Вкрайности · локация</p>
        <h1 id="picker-title">Выберите<br><em>точку.</em></h1>
        <p class="map-section-intro">Выберите точку на мини-карте, подтвердите её галочкой и добавьте следующую.</p>
      </div>
      <div class="map-card map-card--mini">
        <div class="map-stage" data-mini-map role="application" aria-label="Мини-карта для выбора точки">
          <div class="map-water" aria-hidden="true"></div>
          <div class="map-land" aria-hidden="true"></div>
          <button class="map-marker" data-mini-marker type="button" hidden>
            <span class="map-marker__ring"></span><span class="map-marker__dot"></span>
            <span class="map-marker__label" data-marker-label></span>
          </button>
        </div>
        <div class="map-card__meta"><span>Мыс Тобизина</span><span data-picker-status>Нажмите на карту</span></div>
      </div>
      <div class="point-controls glass-panel">
        <div class="point-controls__row point-controls__row--selection">
          <button class="button button--primary point-action" data-point-new type="button">Новая точка <span>＋</span></button>
          <button class="button button--accept point-action" data-point-accept type="button" disabled>Accept последнюю <span>✓</span></button>
          <button class="point-action point-action--quiet" data-point-cancel type="button" disabled>Отменить</button>
          <button class="point-action point-action--danger" data-point-clear type="button">Очистить всё</button>
        </div>
        <div class="point-draft" data-point-draft hidden>
          <label>Название последней точки <input type="text" data-point-name maxlength="80" placeholder="Например, грот"></label>
          <span data-point-draft-status>Кликните по мини-карте</span>
        </div>
        <div class="point-list" data-point-list aria-live="polite"></div>
        <div class="animation-settings" aria-labelledby="animation-settings-title">
          <div><p class="animation-settings__eyebrow">Настройки</p><h3 id="animation-settings-title">Анимация точек</h3></div>
          <label>Задержка между точками <span><input type="number" min="0" max="5000" step="100" value="500" data-animation-gap> мс</span></label>
          <label class="switch-control"><input type="checkbox" data-animation-loop checked><span class="switch-control__track"></span><span>Повторять последовательность</span></label>
          <button class="button button--primary point-preview" data-point-preview type="button">Preview анимации <span>▶</span></button>
        </div>
      </div>
    </section>

    <section class="map-view section-shell" aria-labelledby="view-title">
      <div class="map-section-heading map-section-heading--view">
        <p class="eyebrow"><span class="eyebrow-line"></span> Preview · selected location</p>
        <h2 id="view-title">Точка<br><em>на карте.</em></h2>
      </div>
      <div class="map-card map-card--large">
        <div class="map-stage" data-large-map role="img" aria-label="Большая карта мыса Тобизина с выбранной точкой">
          <div class="map-water" aria-hidden="true"></div>
          <div class="map-land" aria-hidden="true"></div>
          <div class="map-marker" data-large-marker hidden>
            <span class="map-marker__ring"></span><span class="map-marker__dot"></span>
            <span class="map-marker__label" data-large-label></span>
          </div>
        </div>
        <div class="map-card__meta"><span data-selected-name>Точка не выбрана</span><span data-selected-position>—</span></div>
      </div>
    </section>
  </main>

  <script src="./animation-order.js"></script>
  <script src="./points.js"></script>
</body>
</html>
