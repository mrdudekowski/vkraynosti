name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Fired by the GAS "Опубликовать" menu after a catalog status change, so publishing
  # a tour in the Google Sheet rebuilds the static SEO (sitemap/robots/prerender) within minutes.
  repository_dispatch:
    types: [catalog-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Sync tour catalog from CDN
        env:
          VITE_PUBLIC_S3_BASE_URL: ${{ vars.VITE_PUBLIC_S3_BASE_URL || vars.VITE_PUBLIC_ASSET_BASE_URL }}
        run: npm run sync:catalog

      - name: Generate sitemap and robots
        run: |
          npm run generate:sitemap
          npm run generate:robots

      - name: SEO checks
        run: npm run seo:check

      - name: Build
        env:
          VITE_PUBLIC_S3_BASE_URL: ${{ vars.VITE_PUBLIC_S3_BASE_URL || vars.VITE_PUBLIC_ASSET_BASE_URL }}
          VITE_TOUR_REQUEST_ENDPOINT_URL: ${{ vars.VITE_TOUR_REQUEST_ENDPOINT_URL }}
          VITE_YANDEX_METRIKA_ID: ${{ vars.VITE_YANDEX_METRIKA_ID }}
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prerender routes (body + JSON-LD for crawlers)
        env:
          VITE_PUBLIC_S3_BASE_URL: ${{ vars.VITE_PUBLIC_S3_BASE_URL || vars.VITE_PUBLIC_ASSET_BASE_URL }}
          VITE_TOUR_REQUEST_ENDPOINT_URL: ${{ vars.VITE_TOUR_REQUEST_ENDPOINT_URL }}
          VITE_YANDEX_METRIKA_ID: ${{ vars.VITE_YANDEX_METRIKA_ID }}
        run: npm run prerender

      - name: Generate OG shells for SEO
        env:
          VITE_PUBLIC_S3_BASE_URL: ${{ vars.VITE_PUBLIC_S3_BASE_URL || vars.VITE_PUBLIC_ASSET_BASE_URL }}
          VITE_TOUR_REQUEST_ENDPOINT_URL: ${{ vars.VITE_TOUR_REQUEST_ENDPOINT_URL }}
          VITE_YANDEX_METRIKA_ID: ${{ vars.VITE_YANDEX_METRIKA_ID }}
        run: npm run og:shells

      - name: Verify OG shells
        run: npm run verify:og-shells

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
