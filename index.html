<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <link rel="icon" type="image/png" href="%BASE_URL%flavicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="%BASE_URL%flavicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="%BASE_URL%flavicon-light.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://placehold.co https://mc.yandex.ru; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://mc.yandex.ru https://yandex.ru; media-src 'self' blob:; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), clipboard-read=(), clipboard-write=()"
    />
    <title>Вкрайности</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
    />
    <style>
      /* Boot splash — sync hex/timing with src/constants/bootSplash.ts */
      html {
        background-color: #f7f5f0;
      }
      #root {
        visibility: hidden;
      }
      html[data-app-ready] #root {
        visibility: visible;
      }
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f7f5f0;
        transition: opacity 200ms ease;
      }
      #app-boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-wordmark {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: 1.4375rem;
        line-height: 2.0125rem;
        font-weight: 400;
        font-synthesis: none;
      }
      .boot-wordmark__first {
        color: #c8622a;
      }
      html[data-boot-season='winter'] .boot-wordmark__first {
        color: #7ba7bc;
      }
      html[data-boot-season='spring'] .boot-wordmark__first {
        color: #c76b7e;
      }
      html[data-boot-season='summer'] .boot-wordmark__first {
        color: #e8a838;
      }
      html[data-boot-season='fall'] .boot-wordmark__first {
        color: #c8622a;
      }
      .boot-wordmark__rest {
        color: #1a3c2e;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash {
          transition: none;
        }
      }
    </style>
    <script>
      (function () {
        var match = location.pathname.match(/\/(?:tours|telegram)\/(winter|spring|summer|fall)(?:\/|$)/);
        if (match) {
          document.documentElement.setAttribute('data-boot-season', match[1]);
        }
      })();
    </script>
    <script>
      // GitHub Pages SPA: restore path encoded by 404.html
      (function (l) {
        var query = l.search;
        if (!query) return;

        // Support both SPA redirect formats:
        // 1) legacy "?/path&query"
        // 2) current "?p=/path&q=query" from public/404.html
        if (query[1] === '/') {
          var decodedLegacy = query.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decodedLegacy[0] +
            (decodedLegacy[1] ? '?' + decodedLegacy[1] : '') +
            l.hash
          );
          return;
        }

        var params = new URLSearchParams(query);
        var encodedPath = params.get('p');
        if (!encodedPath) return;
        var encodedSearch = params.get('q');
        var decodedPath = encodedPath.replace(/~and~/g, '&');
        var decodedSearch = encodedSearch ? '?' + encodedSearch.replace(/~and~/g, '&') : '';
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decodedPath + decodedSearch + l.hash);
      }(window.location));
    </script>
  </head>
  <body>
    <div
      id="app-boot-splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="Загрузка сайта"
    >
      <span class="boot-wordmark" aria-hidden="true">
        <span class="boot-wordmark__first">В</span><span class="boot-wordmark__rest">крайности</span>
      </span>
    </div>
    <div id="root"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
