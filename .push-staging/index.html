<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <link rel="icon" type="image/png" href="%BASE_URL%flavicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="%BASE_URL%flavicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="%BASE_URL%flavicon-light.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://placehold.co https://mc.yandex.ru; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://mc.yandex.ru https://yandex.ru; media-src 'self' blob:; upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), clipboard-read=(), clipboard-write=()"
    />
    <title>Вкрайности</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
    />
    <style>
      /* Boot splash — sync hex/timing with src/constants/bootSplash.ts */
      html {
        background-color: #f7f5f0;
      }
      #root {
        visibility: hidden;
      }
      html[data-app-ready] #root {
        visibility: visible;
      }
      html[data-skip-boot-splash] #app-boot-splash {
        display: none !important;
      }
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f7f5f0;
        transition: opacity 200ms ease;
      }
      #app-boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        max-width: 100%;
      }
      .boot-wordmark {
        font-family: 'Dela Gothic One', sans-serif;
        font-size: 1.4375rem;
        line-height: 2.0125rem;
        font-weight: 400;
        font-synthesis: none;
        margin: 0;
      }
      .boot-wordmark__first {
        color: #c8622a;
      }
      html[data-boot-season='winter'] .boot-wordmark__first {
        color: #7ba7bc;
      }
      html[data-boot-season='spring'] .boot-wordmark__first {
        color: #c76b7e;
      }
      html[data-boot-season='summer'] .boot-wordmark__first {
        color: #e8a838;
      }
      html[data-boot-season='fall'] .boot-wordmark__first {
        color: #c8622a;
      }
      .boot-wordmark__rest {
        color: #1a3c2e;
      }
      .boot-status-wrap {
        position: relative;
        width: min(20rem, 100%);
        min-height: 3.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .boot-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0 0.25rem;
        font-family: system-ui, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.45;
        font-weight: 400;
        color: #6b7280;
        opacity: 0;
        transform: translateY(0.4rem);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        pointer-events: none;
      }
      .boot-status.is-active {
        opacity: 1;
        transform: translateY(0);
      }
      .boot-status.is-exiting {
        opacity: 0;
        transform: translateY(-0.35rem);
      }
      .boot-bubbles {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        justify-content: center;
        min-height: 0.75rem;
      }
      .boot-bubble {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: color-mix(in srgb, #6b7280 35%, transparent);
        transform: scale(0.82);
        transition:
          transform 180ms ease,
          background-color 180ms ease;
      }
      .boot-bubble.is-filled {
        background: #c8622a;
        transform: scale(1);
      }
      html[data-boot-season='winter'] .boot-bubble.is-filled {
        background: #7ba7bc;
      }
      html[data-boot-season='spring'] .boot-bubble.is-filled {
        background: #c76b7e;
      }
      html[data-boot-season='summer'] .boot-bubble.is-filled {
        background: #e8a838;
      }
      html[data-boot-season='fall'] .boot-bubble.is-filled {
        background: #c8622a;
      }
      .boot-bubble.is-current {
        animation: boot-bubble-pulse 1s ease-in-out infinite;
      }
      @keyframes boot-bubble-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.18);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-splash,
        .boot-status,
        .boot-bubble {
          transition: none;
        }
        .boot-status {
          transform: none;
        }
        .boot-status.is-exiting {
          transform: none;
        }
        .boot-bubble.is-current {
          animation: none;
        }
      }
    </style>
    <script>
      /* Sync: shouldShowBootSplash in src/utils/bootSplashVisit.ts */
      (function () {
        function skipBootSplash() {
          document.documentElement.setAttribute('data-skip-boot-splash', '');
        }

        var nav = performance.getEntriesByType('navigation')[0];
        if (nav) {
          if (nav.type === 'back_forward') {
            skipBootSplash();
            return;
          }
          if (nav.transferSize === 0 && nav.decodedBodySize > 0) {
            skipBootSplash();
            return;
          }
        }

        window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
            skipBootSplash();
          }
        });
      })();
    </script>
    <script>
      (function () {
        var match = location.pathname.match(/\/(?:tours|telegram)\/(winter|spring|summer|fall)(?:\/|$)/);
        if (match) {
          document.documentElement.setAttribute('data-boot-season', match[1]);
        }
      })();
    </script>
    <script>
      // GitHub Pages SPA: restore path encoded by 404.html
      (function (l) {
        var query = l.search;
        if (!query) return;

        // Support both SPA redirect formats:
        // 1) legacy "?/path&query"
        // 2) current "?p=/path&q=query" from public/404.html
        if (query[1] === '/') {
          var decodedLegacy = query.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decodedLegacy[0] +
            (decodedLegacy[1] ? '?' + decodedLegacy[1] : '') +
            l.hash
          );
          return;
        }

        var params = new URLSearchParams(query);
        var encodedPath = params.get('p');
        if (!encodedPath) return;
        var encodedSearch = params.get('q');
        var decodedPath = encodedPath.replace(/~and~/g, '&');
        var decodedSearch = encodedSearch ? '?' + encodedSearch.replace(/~and~/g, '&') : '';
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decodedPath + decodedSearch + l.hash);
      }(window.location));
    </script>
  </head>
  <body>
    <div
      id="app-boot-splash"
      role="progressbar"
      aria-live="polite"
      aria-busy="true"
      aria-label="Загрузка: Заряжаем powerbank на максимум"
      aria-valuemin="0"
      aria-valuemax="7"
      aria-valuenow="1"
    >
      <div class="boot-splash__panel">
        <p class="boot-wordmark" aria-hidden="true">
          <span class="boot-wordmark__first">В</span><span class="boot-wordmark__rest">крайности</span>
        </p>
        <div class="boot-status-wrap">
          <!-- Sync: UI.bootSplash.statusLines[0] in src/constants/ui.ts -->
          <p class="boot-status is-active" id="boot-status-a">Заряжаем powerbank на максимум</p>
          <p class="boot-status" id="boot-status-b"></p>
        </div>
        <div class="boot-bubbles" aria-hidden="true">
          <span class="boot-bubble is-filled is-current"></span>
          <span class="boot-bubble"></span>
          <span class="boot-bubble"></span>
          <span class="boot-bubble"></span>
          <span class="boot-bubble"></span>
          <span class="boot-bubble"></span>
          <span class="boot-bubble"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* Sync load runtime с корректным base (prod SSG-вложенность + dev /vkraynosti/). */
      (function () {
        var base = '/';
        var cssLink = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
        if (cssLink) {
          var href = cssLink.getAttribute('href') || '';
          var assetsIdx = href.indexOf('/assets/');
          if (assetsIdx > 0) {
            base = href.slice(0, assetsIdx + 1);
          }
        } else if (/^\/vkraynosti(\/|$)/.test(location.pathname)) {
          base = '/vkraynosti/';
        }
        document.write('<script src="' + base + 'boot-splash-runtime.js"><\/script>');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
